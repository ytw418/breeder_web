name: Dev to Main Quality Gate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: dev-to-main-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.ref == 'dev' && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI verification
        run: npm run verify:ci

  wait_vercel:
    needs: quality
    if: github.event_name == 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      statuses: read
      pull-requests: read
    steps:
      - name: Wait for Vercel deployment check
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ref = context.payload.pull_request?.head?.sha;
            if (!ref) {
              core.setFailed("No PR head SHA found.");
              return;
            }

            const timeoutMs = 15 * 60 * 1000;
            const intervalMs = 10 * 1000;
            const startedAt = Date.now();

            // Vercel 배포 결과는 check run 이 아니라 커밋 상태(context "Vercel")로 온다.
            // 예전처럼 check run 이름에 "Vercel" 이 들어간 것을 찾으면 이 작업(wait_vercel) 자신이나
            // "Vercel Preview Comments" 가 걸려, 자신이 가장 최근이면 끝날 때까지 자기 자신을 기다리다 시간 초과됐다.
            while (true) {
              const { data } = await github.rest.repos.getCombinedStatusForRef({
                owner,
                repo,
                ref,
                per_page: 100,
              });

              // getCombinedStatusForRef 는 context 마다 가장 최근 상태 하나만 돌려준다.
              const vercelStatus = data.statuses.find((s) => s.context === "Vercel");

              if (vercelStatus) {
                core.info(`Vercel status state=${vercelStatus.state}`);

                if (vercelStatus.state === "success") {
                  core.info("Vercel deployment passed.");
                  return;
                }
                if (vercelStatus.state === "failure" || vercelStatus.state === "error") {
                  core.setFailed(`Vercel deployment failed: ${vercelStatus.state}`);
                  return;
                }
              } else {
                core.info("Vercel status not created yet. Waiting...");
              }

              if (Date.now() - startedAt > timeoutMs) {
                core.setFailed("Timed out waiting for Vercel deployment check.");
                return;
              }

              await new Promise((resolve) => setTimeout(resolve, intervalMs));
            }

  notify_slack:
    needs: [quality, wait_vercel]
    if: github.event_name == 'pull_request' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send Slack notification
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPO: ${{ github.repository }}
          VERCEL_STATUS: ${{ needs.wait_vercel.result }}
          VERCEL_JOB_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const webhook = process.env.SLACK_WEBHOOK_URL;
            if (!webhook) {
              core.info("No webhook configured. Set SLACK_WEBHOOK_URL secret.");
              return;
            }

            const payload = {
              text: `✅ Merge ready: ${process.env.PR_TITLE}\n${process.env.PR_URL}\nrepo: ${process.env.REPO}\nVercel check: ${process.env.VERCEL_STATUS}\n${process.env.VERCEL_JOB_URL}`
            };

            const res = await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!res.ok) {
              const body = await res.text();
              core.setFailed(`Slack notification failed: ${res.status} ${body}`);
            }
