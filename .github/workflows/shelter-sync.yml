name: 보호소 아이들 동기화

# 3시간마다 운영 서버의 /api/internal/cron/shelter-sync 를 부른다(앱 docs/prd/shelter-animals.md, libs/server/shelterSync.ts).
# 국가동물보호정보시스템의 보호 중 강아지·고양이 공고를 입양 쪽 글로 넣고, 연속 두 번 빠진 공고는 숨긴다.
# Vercel Hobby 는 하루 한 번보다 잦은 크론을 못 써서 여기서 부른다(reengagement-hourly.yml 과 같은 방식).
# 서버가 받기에 실패하거나(data.go.kr 장애·키 만료) 저장에 실패하면 응답에 "ok":false 가 있어 이 작업이 실패로 표시된다 — 다음 회차에 다시 한다.
# 저장소 비밀값 CRON_SECRET(Vercel 운영 env 와 같은 값)이 없으면 건너뛴다.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      maxNew:
        description: "이번 회차에 새로 넣을 최대 공고 수(서버 최대 500, 비우면 서버 기본 150)"
        required: false
        default: "150"

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 보호소 아이들 동기화 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://bredy.app
          MAX_NEW: ${{ inputs.maxNew }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET 비밀값이 없어 건너뛴다."
            exit 0
          fi
          url="$SITE_URL/api/internal/cron/shelter-sync"
          # 손으로 돌릴 때만 maxNew 를 넘긴다(예약 실행은 비어 있어 서버 기본값을 쓴다). 숫자가 아니면 무시한다.
          case "$MAX_NEW" in
            ""|*[!0-9]*) ;;
            *) url="$url?maxNew=$MAX_NEW" ;;
          esac
          body=$(curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$url")
          echo "$body"
          if echo "$body" | grep -q '"ok":false'; then
            echo "동기화가 실패했다(받기 오류·저장 실패·시간 한도 안에 새 글 0건)."
            exit 1
          fi
