name: 토론 마감 알림

# 매시 운영 서버의 /api/internal/cron/debate-closing 을 부른다(재방문 알림 ②, libs/server/reengagement.ts, 앱 docs/prd/reengagement-push.md).
# Vercel Hobby 는 하루 한 번보다 잦은 크론을 못 써서 매시 호출은 여기서 한다(first-post-watch.yml 과 같은 방식).
# 토론마다 한 번만 알리므로 늦게 돌거나 겹쳐도 된다. 21시~8시(KST)에는 서버가 아무것도 보내지 않는다.
# 저장소 비밀값 CRON_SECRET(Vercel 운영 env 와 같은 값)이 없으면 건너뛴다.
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 토론 마감 알림 호출
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: https://bredy.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET 비밀값이 없어 건너뛴다."
            exit 0
          fi
          curl -fsS --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/internal/cron/debate-closing"
